# ─────────────────────────────────────────────────────────
# RPS Battle — application.properties blueprint
# Secrets: application-local.properties (gitignored) or env vars
# ─────────────────────────────────────────────────────────

spring.config.import=optional:classpath:application-local.properties

# ── SERVER ──────────────────────────────────────────────
server.port=${PORT:8080}
server.address=0.0.0.0

# ── DATABASE ────────────────────────────────────────────
# Local: MySQL defaults. Render: set SPRING_DATASOURCE_* env vars (PostgreSQL).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rps_battle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:your_password_here}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# ── JPA / HIBERNATE ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── TORN API (house account — deposit verification) ─────
torn.api.base-url=https://api.torn.com
torn.api.my-key=${TORN_API_MY_KEY:YOUR_PERSONAL_TORN_API_KEY_HERE}
torn.api.events-path=/user/?selections=events

# Players must send Xanax to the house account (API key owner) with this exact message:
torn.deposit.required-message=RPS
torn.deposit.recipient-name=Hannath
torn.deposit.recipient-id=3961385
# Parsed from event log (Torn uses square brackets for sender ID):
# You received {amount}x Xanax from {username} [{tornId}] with the message: RPS

# Reject deposits older than this many hours (Torn event timestamp):
torn.deposit.max-age-hours=72

# ── MOOLA / GAME ECONOMY ──────────────────────────────────
game.moola-per-xanax=4
game.house-rake-percent=3
game.min-bet-moola=4
game.best-of-rounds=3

# Withdrawals must convert back to whole Xanax (multiple of moola-per-xanax):
game.withdrawal-moola-step=4

# ── ADMIN (manual withdrawal dashboard) ─────────────────
# Admin panel: use TORN_API_MY_KEY (house account) or this optional legacy secret
admin.secret-key=${ADMIN_SECRET_KEY:change-this-to-a-secure-admin-key}

# ── WEBSOCKET ───────────────────────────────────────────
game.websocket.path=/ws/game

# ── HTTP SESSION (login cookie for deposit/withdraw) ────
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
